[package]
name = "fund_nft"
version = "0.1.0"
description = "Fund NFT: a vault that dollar-cost-averages quote tokens through XDEX"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "fund_nft"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Pin the X1 testnet XDEX program id instead of mainnet.
testnet = []

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = { version = "1.2.2", features = ["metadata"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
